
name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill structure and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Diagnose code review skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/software-engineering/code-review/SKILL.md")
          print(f"Working directory: {Path.cwd()}")
          print(f"File exists: {path.exists()}")

          if not path.exists():
              raise SystemExit(f"Missing file: {path}")

          content = path.read_bytes()
          print(f"First 80 bytes: {content[:80]!r}")
          print(f"Starts with YAML delimiter: {content.startswith(b'---')}")
          print(f"Has UTF-8 BOM: {content.startswith(bytes.fromhex('efbbbf'))}")
          PY

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Run validator tests
        run: python -m unittest discover -s tests -v
